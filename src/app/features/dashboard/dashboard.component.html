<div class="min-h-screen bg-gray-50">
  <app-navbar />

  <main class="max-w-7xl mx-auto px-2 sm:px-6 lg:px-8 py-8">

    <div class="mb-12">
      <div class="rounded-2xl bg-gradient-to-br from-blue-50 via-blue-50 to-indigo-50 border border-blue-100/50 p-8 sm:p-10 shadow-sm">

        <div class="flex items-start justify-between gap-6">

          <div class="flex-1">
            <h2 class="text-4xl sm:text-5xl font-bold text-slate-900 mb-3 leading-tight">
              ¡Bienvenido,
              <span class="bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
                Afiliado Prueba
              </span>!
            </h2>

            <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-4 text-slate-600">

              <p class="text-sm font-medium">
                {{ formattedDate }}
              </p>

              <span class="hidden sm:inline text-slate-300">•</span>

              <p class="text-sm font-medium text-blue-600">
                Última actualización: hace un momento
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Módulos -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-4 justify-items-center items-center">

      @for (module of modules; track module) {
        <div
          class="bg-white border shadow-sm rounded-xl hover:shadow-xl transition-all duration-300 p-4 cursor-pointer transform hover:scale-105 md:max-w-[700px] w-full h-full"
          (click)="goToModule(module.ruta)"
          >
          <div class="flex items-start gap-6">
            <div class="text-4xl">{{ module.icono }}</div>
            <div class="flex-1">
              <h2 class="text-xl font-bold text-gray-900 mb-2">
                {{ module.titulo }}
              </h2>
              <p class="text-gray-600 text-sm mb-4">
                {{ module.descripcion }}
              </p>
              <button
                class="inline-block px-4 py-2 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 active:bg-indigo-800 transition-colors">
                Ir al módulo →
              </button>
            </div>
          </div>
        </div>
      }
    </div>

    <div class="mt-12 text-center text-gray-500">
      <p>Portal de Afiliados • Año 2026</p>
    </div>
  </main>
</div>
