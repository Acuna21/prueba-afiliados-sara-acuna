<div class="min-h-screen bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center p-4">
  <div class="bg-white rounded-lg shadow-2xl w-full max-w-md p-8">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="text-5xl mb-4">🏥</div>
      <h1 class="text-2xl font-bold text-gray-900">Portal de Afiliados</h1>
      <p class="text-gray-600 mt-2">Sistema de Gestión</p>
    </div>

    <!-- Error Message -->
    <div
      *ngIf="errorMessage()"
      class="mb-4 p-4 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm"
    >
      {{ errorMessage() }}
    </div>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <!-- Email Field -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
          Correo Electrónico
        </label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="correo@ejemplo.com"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
          [class.border-red-500]="email?.invalid && email?.touched"
        />
        <p
          *ngIf="email?.invalid && email?.touched"
          class="mt-1 text-sm text-red-600"
        >
          <span *ngIf="email?.errors?.['required']">El correo es requerido</span>
          <span *ngIf="email?.errors?.['email']">Correo electrónico no válido</span>
        </p>
      </div>

      <!-- Password Field -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
          Contraseña
        </label>
        <div class="relative">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
            [class.border-red-500]="password?.invalid && password?.touched"
          />
          <button
            type="button"
            (click)="togglePasswordVisibility()"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700"
          >
            <span *ngIf="!showPassword()">👁️</span>
            <span *ngIf="showPassword()">👁️‍🗨️</span>
          </button>
        </div>
        <p
          *ngIf="password?.invalid && password?.touched"
          class="mt-1 text-sm text-red-600"
        >
          <span *ngIf="password?.errors?.['required']">La contraseña es requerida</span>
        </p>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="loginForm.invalid || isLoading()"
        class="w-full mt-6 px-4 py-3 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 active:bg-indigo-800 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200"
      >
        <span *ngIf="isLoading()" class="flex items-center justify-center gap-2">
          <span class="animate-spin">⌛</span>
          Ingresando...
        </span>
        <span *ngIf="!isLoading()">Ingresar</span>
      </button>
    </form>
  </div>
</div>
